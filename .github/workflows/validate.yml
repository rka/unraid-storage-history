name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find src tests \( -name '*.php' -o -name '*.page' \) -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check src/assets/storage-history.js
      - name: Behavior tests
        run: php tests/run.php
      - name: Release manifest
        run: php tests/validate-release.php
